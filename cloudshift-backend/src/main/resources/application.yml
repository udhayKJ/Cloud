spring:
  application:
    name: cloudshift-backend

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===== Flyway =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ===== Jackson =====
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ===== JWT =====
app:
  jwt:
    secret: ${JWT_SECRET:cloudshift-dev-secret-key-minimum-32-characters-long-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

# ===== AWS (real values injected via env vars when credentials are available) =====
  aws:
    region: ${AWS_REGION:us-east-1}
    s3:
      bucket-name: ${S3_BUCKET_NAME:cloudshift-reports-dev}
    cloudwatch:
      namespace: CloudShiftAI
    bedrock:
      model-id: ${BEDROCK_MODEL_ID:anthropic.claude-haiku-20240307-v1:0}
    dynamodb:
      table-name: ${DYNAMODB_TABLE:cloudshift-simulation-events}

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ===== Logging =====
logging:
  level:
    com.cloudshift: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO

---
# ===================================================
# LOCAL DEV PROFILE  (mvn spring-boot:run -Dspring-boot.run.profiles=dev)
# Uses H2 in-memory DB — no AWS RDS needed
# ===================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:cloudshiftdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop      # H2 — recreate on start, drop on stop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false               # Disable Flyway for H2 dev (DDL handled by Hibernate)

---
# ===================================================
# PRODUCTION PROFILE  (profile: prod)
# Reads real AWS RDS credentials from environment vars
# ===================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
